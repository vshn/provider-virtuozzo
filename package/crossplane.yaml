apiVersion: meta.pkg.crossplane.io/v1alpha1
kind: Provider
metadata:
  name: provider-virtuozzo
  annotations:
    meta.crossplane.io/maintainer: VSHN <info@vshn.ch>
    meta.crossplane.io/source: github.com/vshn/provider-virtuozzo
    meta.crossplane.io/license: Apache-2
    meta.crossplane.io/description: |
      VSHN's Crossplane provider to manage S3 buckets on Virtuozzo infrastructure.
    meta.crossplane.io/readme: |
      `provider-virtuozzo` is the Crossplane infrastructure provider for
      Virtuozzo S3 storage, provided by [VSHN](https://www.vshn.ch/).
      Available resources and their fields can be found in the CRD Docs.
      If you encounter an issue please create an issue in the
      [vshn/provider-virtuozzo](https://github.com/vshn/provider-virtuozzo/issues) repo.
spec:
  crossplane:
    version: ">=v1.9.0"
